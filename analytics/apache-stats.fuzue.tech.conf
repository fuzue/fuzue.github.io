# Analytics for fuzue.tech — GoatCounter behind Apache on vaz.io.
# The service itself listens on 127.0.0.1:8099; see goatcounter.service.
# Install to /etc/apache2/sites-available/ and enable with a2ensite.

<VirtualHost *:80>
    ServerName stats.fuzue.tech

    DocumentRoot /var/www/stats-acme
    <Directory /var/www/stats-acme>
        Require all granted
    </Directory>

    # ACME http-01 challenges must stay on plain HTTP; everything else goes to TLS.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName stats.fuzue.tech

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/stats.fuzue.tech/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stats.fuzue.tech/privkey.pem
    Header always set Strict-Transport-Security "max-age=15768000; includeSubDomains"

    ErrorLog  /var/log/apache2/stats.fuzue.tech-error.log
    CustomLog /var/log/apache2/stats.fuzue.tech-access.log common

    # GoatCounter picks the site from the Host header, so it must be preserved.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # The dashboard streams its data over a WebSocket at /loader. This has to
    # come before the catch-all below, or it gets proxied as plain HTTP and the
    # dashboard hangs on loading.
    ProxyPass        /loader ws://127.0.0.1:8099/loader
    ProxyPassReverse /loader ws://127.0.0.1:8099/loader

    ProxyPass        / http://127.0.0.1:8099/
    ProxyPassReverse / http://127.0.0.1:8099/
</VirtualHost>
